<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h1 class="display-4 text-success mb-2">🌍 EcoTrack</h1>
                            <p class="text-muted">Carbon Footprint Tracker</p>
                        </div>
                        
                        {% if message %}
                        <div class="alert alert-warning" role="alert">
                            {{ message }}
                        </div>
                        {% endif %}
                        
                        <form method="POST" action="{{ url_for('login') }}">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control form-control-lg" id="username" name="username" 
                                       placeholder="Enter your username" required {% if message and 'tomorrow' in message %}disabled{% endif %}>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control form-control-lg" id="password" name="password" 
                                       placeholder="Enter your password" required {% if message and 'tomorrow' in message %}disabled{% endif %}>
                            </div>
                            
                            <button type="submit" class="btn btn-success btn-lg w-100" {% if message and 'tomorrow' in message %}disabled{% endif %}>
                                Start Tracking 🌱
                            </button>
                        </form>
                        
                        <div class="mt-4 text-center text-muted small">
                            <p>You can only log in once per day.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
